<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Join CS2 server – Shiron</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
         font: 16px/1.5 system-ui, sans-serif; background: #1e1f22; color: #f2f3f5; }
  main { padding: 2rem; max-width: 32rem; }
  code { background: #2b2d31; padding: .2em .5em; border-radius: 4px; user-select: all; }
  a { color: #8ea1e1; }
</style>
</head>
<body>
<main>
  <h1>Joining CS2 server…</h1>
  <p id="msg">Opening Steam.</p>
</main>
<script>
  // Shiron links here as connect.html#IP:PORT. Discord buttons can't open steam://
  // links directly, so this page does it. Only plain IPv4/IPv6 addresses are accepted.
  const addr = decodeURIComponent(location.hash.slice(1));
  const msg = document.getElementById("msg");
  const valid = /^(\d{1,3}(\.\d{1,3}){3}|\[[0-9a-fA-F:]+\]):\d{1,5}$/.test(addr);
  if (!valid) {
    msg.textContent = "This link doesn't contain a valid server address.";
  } else {
    const steamURL = "steam://connect/" + addr;
    location.href = steamURL;
    msg.textContent = "If CS2 didn't open, ";
    const link = document.createElement("a");
    link.href = steamURL;
    link.textContent = "click here";
    msg.append(link, ", or open the CS2 console and type ");
    const cmd = document.createElement("code");
    cmd.textContent = "connect " + addr;
    msg.append(cmd);
  }
</script>
</body>
</html>
